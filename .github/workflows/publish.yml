name: Publish to npm

# Publishing is triggered by pushing a version tag that matches package.json,
# for example:  npm version patch && git push --follow-tags
# A manual run (workflow_dispatch) only does a dry run unless "publish" is ticked.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Really publish to npm (otherwise npm publish --dry-run)'
        type: boolean
        default: false

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci
      - name: Type check
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Smoke test the built package (ESM and CJS)
        run: npm run smoke

  publish:
    name: Publish
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm 11.5.1 or newer; Node 22 ships an older npm.
      - name: Update npm
        run: npm install -g npm@^11.5.1 && npm --version

      - name: Check that the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          pkg="v$(node -p "require('./package.json').version")"
          if [ "$pkg" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${pkg}"
            exit 1
          fi

      - run: npm ci
      - run: npm run build
      - run: npm run smoke

      - name: Choose dist-tag
        id: tag
        run: |
          version="$(node -p "require('./package.json').version")"
          case "$version" in
            *-*) echo "name=next" >> "$GITHUB_OUTPUT" ;;   # 1.2.0-beta.1 and similar
            *)   echo "name=latest" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Preview package contents
        run: npm pack --dry-run

      - name: Publish (dry run)
        if: github.event_name == 'workflow_dispatch' && !inputs.publish
        run: npm publish --dry-run --ignore-scripts --access public --tag ${{ steps.tag.outputs.name }}

      - name: Publish
        if: github.event_name == 'push' || inputs.publish
        # Scripts are skipped because lint, tests, build and smoke already ran above.
        # No token is used: npm trusted publishing (OIDC) authenticates this workflow run.
        run: npm publish --provenance --ignore-scripts --access public --tag ${{ steps.tag.outputs.name }}
